# /etc/nginx/sites-available/smartcloud-portal
# Replace onboarding.example.com.mt with the real hostname, then:
#   ln -s /etc/nginx/sites-available/smartcloud-portal /etc/nginx/sites-enabled/
#   certbot --nginx -d onboarding.example.com.mt      (or install your corporate certificate)
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name onboarding.example.com.mt;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name onboarding.example.com.mt;

    ssl_certificate     /etc/letsencrypt/live/onboarding.example.com.mt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onboarding.example.com.mt/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- Optional extra lock-down: only allow the two companies' office / VPN egress IPs ----
    # allow 203.0.113.0/24;     # Melita offices / VPN   (replace)
    # allow 198.51.100.0/24;    # Smart Technologies     (replace)
    # deny  all;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
