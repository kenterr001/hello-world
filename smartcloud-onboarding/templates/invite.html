{% extends "base.html" %}{% block title %}Set password{% endblock %}{% block bodyclass %}auth{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Welcome, {{ u.name }}</h1>
  <p class="muted">Set a password for <strong>{{ u.email }}</strong>. Minimum 12 characters.</p>
  <form method="post" class="stack">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>New password<input type="password" name="password" minlength="12" required autocomplete="new-password"></label>
    <label>Repeat password<input type="password" name="password2" minlength="12" required autocomplete="new-password"></label>
    <button class="btn primary block">Activate account</button>
  </form>
</div>
{% endblock %}
